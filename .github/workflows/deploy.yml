name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package Release
        run: tar -czf release.tgz dist deploy package.json package-lock.json

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and Activate Release
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" release.tgz "$TARGET:/tmp/invitation-api-$release.tgz"
          ssh "${ssh_opts[@]}" "$TARGET" "set -e
            dir=/var/www/invitation-api/releases/$release
            mkdir -p \"\$dir\"
            tar -xzf /tmp/invitation-api-$release.tgz -C \"\$dir\"
            rm -f /tmp/invitation-api-$release.tgz
            bash \"\$dir/deploy/release.sh\""

      - name: Check Public API
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://api.savethekath.com/health
